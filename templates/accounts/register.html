{% extends 'base.html' %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="auth-card">
                    <h2 class="auth-title">Create Your Account</h2>
                    <p class="auth-subtitle">Start uploading sales data and training models.</p>

                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100">Register</button>
                    </form>

                    <p class="mt-3 mb-0 text-center">
                        Already registered? <a href="/accounts/login/">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
