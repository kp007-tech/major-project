<!DOCTYPE html>
<html>
<head>
    <title>Training Result</title>
</head>
<body>
    <h1>Training Result</h1>

    <p><strong>Dataset:</strong> {{ dataset.name }}</p>

    <h2>Detected Columns</h2>
    <ul>
        {% for col in columns %}
            <li>{{ col }}</li>
        {% endfor %}
    </ul>

    <h2>Sample Data</h2>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                {% for col in columns %}
                    <th>{{ col }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
                <tr>
                    {% for col in columns %}
                        <td>{{ row|get_item:col }}</td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
